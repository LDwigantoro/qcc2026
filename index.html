<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QCC PDS 2026</title>
    <script>
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(navigator.userAgent);
        
        const targetPage = isIOS
            ? 'index-ios.html'
            : isAndroid
                ? 'index-android.html'
                : 'index-desktop.html';

        // Survey harus diselesaikan sebelum pengguna membuka tampilan AR/3D.
        window.location.replace(`survey-tower.html?target=${encodeURIComponent(targetPage)}`);
    </script>
</head>
<body>
    <p>Redirecting to the appropriate version...</p>
</body>
</html>
