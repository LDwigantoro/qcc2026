<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCC PDS 2026</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .survey-form {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .radio-group, .checkbox-group {
            margin-bottom: 10px;
        }
        .radio-group label, .checkbox-group label {
            display: inline-block;
            margin-right: 15px;
            font-weight: normal;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 30px auto 0;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #2980b9;
        }
        .required {
            color: #e74c3c;
        }
        .form-note {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        /* PDF Preview Styles */
        .pdf-preview-container {
            display: none;
            margin-top: 30px;
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .pdf-preview {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            margin-bottom: 20px;
        }
        .preview-buttons {
            display: flex;
            justify-content: space-between;
        }
        .preview-btn {
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .edit-btn {
            background-color: #f39c12;
            color: white;
            border: none;
        }
        .download-btn {
            background-color: #27ae60;
            color: white;
            border: none;
        }
        .send-btn {
            background-color: #3498db;
            color: white;
            border: none;
        }
        .ar-btn {
            background-color: #8e44ad;
            color: white;
            border: none;
        }
        .unit {
            font-size: 14px;
            color: #7f8c8d;
            margin-left: 5px;
        }
        /* Tower Recommendation Styles */
        .tower-recommendation {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f4fc;
            border-left: 4px solid #3498db;
            border-radius: 5px;
        }
        .tower-recommendation h3 {
            color: #2c3e50;
            margin-top: 0;
        }
        .tower-recommendation p {
            margin-bottom: 5px;
        }
        .highlight {
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
    <!-- Include jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <h1>Survey Kebutuhan Retaining Wall</h1>
    
    <form class="survey-form" id="surveyForm">
        <div class="form-group">
            <label for="responden">Nama<span class="required">*</span></label>
            <input type="text" id="responden" name="responden" required>
        </div>
        
        <div class="form-group">
            <label for="nik">NIK <span class="required">*</span></label>
            <input type="text" id="nik" name="nik" title="Masukkan NIK Anda" maxlength="16" required>
        </div>
        
        <div class="form-group">
            <label>1. Bentuk lahan/kontur tampak jauh <span class="required">*</span></label>
            <p class="form-note">Unggah foto dari seluruh sisi lahan.</p>

            <label for="foto_lahan_kanan">a. Tampak sisi kanan lahan <span class="required">*</span></label>
            <input type="file" id="foto_lahan_kanan" name="foto_lahan_kanan" accept="image/*" required>

            <label for="foto_lahan_kiri">b. Tampak sisi kiri lahan <span class="required">*</span></label>
            <input type="file" id="foto_lahan_kiri" name="foto_lahan_kiri" accept="image/*" required>

            <label for="foto_lahan_depan">c. Tampak depan lahan <span class="required">*</span></label>
            <input type="file" id="foto_lahan_depan" name="foto_lahan_depan" accept="image/*" required>

            <label for="foto_lahan_belakang">d. Tampak belakang lahan <span class="required">*</span></label>
            <input type="file" id="foto_lahan_belakang" name="foto_lahan_belakang" accept="image/*" required>
        </div>

        <div class="form-group">
            <label for="ketinggian_tower">2. Ketinggian tower sesuai request operator (meter)<span class="required">*</span></label>
            <input type="number" id="ketinggian_tower" name="ketinggian_tower" min="1" max="200" required>
        </div>

        <div class="form-group">
            <label>3. Visual cek kondisi tanah <span class="required">*</span></label>
            <div class="radio-group">
                <label><input type="radio" name="kondisi_tanah" value="Keras" required> Keras</label>
                <label><input type="radio" name="kondisi_tanah" value="Sedang"> Sedang</label>
                <label><input type="radio" name="kondisi_tanah" value="Lunak"> Lunak</label>
            </div>
        </div>

        <div class="form-group">
            <label for="kemiringan_tanah">4. Berapa derajat kemiringan tanah? <span class="required">*</span></label>
            <input type="number" id="kemiringan_tanah" name="kemiringan_tanah" min="0" max="90" step="0.1" required placeholder="Contoh: 25">
        </div>

        <button type="submit" class="submit-btn">Generate PDF Preview</button>
    </form>

    <!-- PDF Preview Section -->
    <div id="pdfPreviewContainer" class="pdf-preview-container">
        <h2>Preview Dokumen Survey</h2>
        <iframe id="pdfPreview" class="pdf-preview" frameborder="0"></iframe>
        <div class="preview-buttons">
            <button id="editBtn" class="preview-btn edit-btn">Edit Survey</button>
            <button id="downloadBtn" class="preview-btn download-btn">Download PDF</button>
            <button id="sendBtn" class="preview-btn send-btn">Kirim via Email</button>
            <button id="continueToArBtn" class="preview-btn ar-btn">Lanjut ke AR</button>
        </div>
    </div>

    <script>
        // Initialize jsPDF
        const { jsPDF } = window.jspdf;
        
        // Store image data
        let imageData = {
            foto_lahan_kanan: null,
            foto_lahan_kiri: null,
            foto_lahan_depan: null,
            foto_lahan_belakang: null
        };
        let previewUrl = null;

        document.getElementById('surveyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Load images first
            await loadAllImages();
            
            // Collect form data
            const formData = new FormData(this);
            const data = {};
            formData.forEach((value, key) => {
                if (value instanceof File) {
                    data[key] = value.name || 'Tidak ada file dipilih';
                } else {
                    data[key] = value;
                }
            });
            
            // Generate PDF
            generatePDF(data);
            
            // Show preview section
            document.getElementById('pdfPreviewContainer').style.display = 'block';
            
            // Scroll to preview
            document.getElementById('pdfPreviewContainer').scrollIntoView({ behavior: 'smooth' });
        });
        
        async function loadAllImages() {
            // Reset image data
            imageData = {
                foto_lahan_kanan: null,
                foto_lahan_kiri: null,
                foto_lahan_depan: null,
                foto_lahan_belakang: null
            };
            for (const field of Object.keys(imageData)) {
                const file = document.getElementById(field).files[0];
                if (file) imageData[field] = await getImageData(file);
            }
        }
        
        function getImageData(file) {
            return new Promise((resolve) => {
                if (!file) {
                    resolve(null);
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    resolve(e.target.result);
                };
                reader.readAsDataURL(file);
            });
        }
        
        function generatePDF(data) {
            const doc = new jsPDF();
            
            // Add logo or header
            doc.setFontSize(18);
            doc.setTextColor(40, 60, 80); // Dark blue color
            doc.text('SURVEY KEBUTUHAN RETAINING WALL', 105, 20, { align: 'center' });
            
            doc.setFontSize(12);
            doc.setTextColor(100, 100, 100);
            doc.text('QCC PDS 2026', 105, 28, { align: 'center' });
            
            // Add line separator
            doc.setDrawColor(52, 152, 219); // Blue color
            doc.setLineWidth(0.5);
            doc.line(20, 35, 190, 35);
            
            // Add respondent info
            doc.setFontSize(14);
            doc.setTextColor(40, 60, 80);
            doc.text('Informasi Responden', 20, 45);
            
            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text(`Nama: ${data.responden || 'Tidak diisi'}`, 20, 55);
            doc.text(`NIK: ${data.nik || 'Tidak diisi'}`, 20, 65);
            
            // Add survey questions
            doc.setFontSize(14);
            doc.setTextColor(40, 60, 80);
            doc.text('Hasil Survey', 20, 80);
            
            // Create table data
            const surveyData = [
                ['1a. Foto sisi kanan lahan', data.foto_lahan_kanan || 'Tidak diisi'],
                ['1b. Foto sisi kiri lahan', data.foto_lahan_kiri || 'Tidak diisi'],
                ['1c. Foto sisi depan lahan', data.foto_lahan_depan || 'Tidak diisi'],
                ['1d. Foto sisi belakang lahan', data.foto_lahan_belakang || 'Tidak diisi'],
                ['2. Ketinggian tower sesuai request operator', `${data.ketinggian_tower || 'Tidak diisi'} meter`],
                ['3. Kondisi tanah', data.kondisi_tanah || 'Tidak diisi'],
                ['4. Kemiringan tanah', `${data.kemiringan_tanah || 'Tidak diisi'}°`],
                [
                    'Kebutuhan retaining wall',
                    Number(data.kemiringan_tanah) > 25
                        ? 'Memerlukan retaining wall (kemiringan > 25°)'
                        : 'Tidak memerlukan retaining wall berdasarkan kemiringan tanah (≤ 25°)'
                ]
            ];
            
            // Add table
            doc.autoTable({
                startY: 85,
                head: [['Pertanyaan', 'Jawaban']],
                body: surveyData,
                theme: 'grid',
                headStyles: {
                    fillColor: [52, 152, 219], // Blue header
                    textColor: 255 // White text
                },
                alternateRowStyles: {
                    fillColor: [240, 240, 240] // Light gray alternate rows
                },
                margin: { left: 20 },
                didDrawPage: function(data) {
                    // Footer
                    doc.setFontSize(10);
                    doc.setTextColor(100, 100, 100);
                    doc.text('* File pendukung terlampir pada halaman berikutnya', 20, doc.internal.pageSize.height - 10);
                }
            });
            
            // Add land photos on separate pages
            const photoLabels = {
                foto_lahan_kanan: 'Tampak Sisi Kanan Lahan',
                foto_lahan_kiri: 'Tampak Sisi Kiri Lahan',
                foto_lahan_depan: 'Tampak Depan Lahan',
                foto_lahan_belakang: 'Tampak Belakang Lahan'
            };
            for (const [field, label] of Object.entries(photoLabels)) {
                if (!imageData[field]) continue;
                doc.addPage();
                doc.setFontSize(14);
                doc.text(`Lampiran Foto ${label}`, 20, 20);
                try {
                    doc.addImage(imageData[field], 'JPEG', 20, 30, 170, 120);
                } catch (e) {
                    console.error(`Error adding ${field}:`, e);
                    doc.text(`Gagal menampilkan foto ${label}`, 20, 40);
                }
            }
            
            // Save PDF to preview
            // Blob URL lebih andal daripada data URI untuk PDF dengan beberapa foto berukuran besar.
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = URL.createObjectURL(doc.output('blob'));
            document.getElementById('pdfPreview').src = previewUrl;
            
            // Set up download button
            document.getElementById('downloadBtn').onclick = function() {
                doc.save(`Survey Retaining Wall - ${data.responden || 'Anonim'}.pdf`);
            };
            
            // Set up email button
            document.getElementById('sendBtn').onclick = function() {
                sendEmail(data);
            };
            
            // Set up edit button
            document.getElementById('editBtn').onclick = function() {
                document.getElementById('pdfPreviewContainer').style.display = 'none';
            };

            // AR/3D hanya dapat dibuka setelah survey berhasil diproses.
            document.getElementById('continueToArBtn').onclick = function() {
                const allowedTargets = new Set([
                    'index-desktop.html',
                    'index-ios.html',
                    'index-android.html'
                ]);
                const requestedTarget = new URLSearchParams(window.location.search).get('target');
                const targetPage = allowedTargets.has(requestedTarget)
                    ? requestedTarget
                    : 'index.html';

                sessionStorage.setItem('surveyCompleted', 'true');
                window.location.href = targetPage;
            };
        }
        
        function sendEmail(data) {
            const emailBody = `
                Survey
                ================================
                
                Nama Responden: ${data.responden}
                NIK: ${data.nik}
                
                1. Bentuk lahan/kontur tampak jauh:
                   - Sisi kanan: ${data.foto_lahan_kanan || 'Tidak diisi'}
                   - Sisi kiri: ${data.foto_lahan_kiri || 'Tidak diisi'}
                   - Sisi depan: ${data.foto_lahan_depan || 'Tidak diisi'}
                   - Sisi belakang: ${data.foto_lahan_belakang || 'Tidak diisi'}

                2. Ketinggian tower sesuai request operator: ${data.ketinggian_tower || 'Tidak diisi'} meter

                3. Kondisi tanah: ${data.kondisi_tanah || 'Tidak diisi'}

                4. Kemiringan tanah: ${data.kemiringan_tanah || 'Tidak diisi'}°

                Kebutuhan retaining wall: ${Number(data.kemiringan_tanah) > 25 ? 'Memerlukan retaining wall (kemiringan > 25°).' : 'Tidak memerlukan retaining wall berdasarkan kemiringan tanah (≤ 25°).'}

                ================================
                MOHON LAMPIRKAN EMPAT FOTO LAHAN pada email ini sebelum mengirim.
            `;
            
            const subject = `Survey Retaining Wall - ${data.responden}`;
            const recipients = 'andini.atma@tower-bersama.com,ali.gunawan@tower-bersama.com';
            const mailtoLink = `mailto:${recipients}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(emailBody)}`;
            
            window.location.href = mailtoLink;
            
            alert('Terima kasih! Survey akan dikirim via email. Mohon lampirkan empat foto lahan pada email yang terbuka.');
        }
    </script>
</body>
</html>
