<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>QCC PDS 2026 - iOS</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        if (sessionStorage.getItem('surveyCompleted') !== 'true') {
            window.location.replace('survey-tower.html?target=index-ios.html');
        }
    </script>
</head>

<body class="bg-light ios-device">
    <!-- Main Menu -->
    <div id="main-menu" class="container-fluid vh-100 d-flex flex-column justify-content-center active-page">
        <div class="row justify-content-center">
            <div class="col-12 text-center mb-5">
                <h1 class="display-4 fw-bold">Pilih Jenis Retaining Wall</h1>
            </div>

           <div class="col-md-8 col-lg-6">
                <div class="row g-4">
                    <div class="col-md-4">
                        <a href="assets/Retainning_Wall_1_Side_Corner_L.usdz" rel="ar" class="text-decoration-none d-block h-100">
                        <div class="card tower-option h-100" data-model="Retainning_Wall_1_Side_Corner_L">
                            <img src="assets/L.png" class="card-img-top p-3" alt="Type L" loading="lazy">
                            <div class="card-body text-center">
                                <h5 class="card-title">Type L</h5>
                            </div>
                        </div>
                        </a>
                    </div>

                    <div class="col-md-4">
                        <a href="assets/Retainning_Wall_1_Side_Middle.usdz" rel="ar" class="text-decoration-none d-block h-100">
                        <div class="card tower-option h-100" data-model="Retainning_Wall_1_Side_Middle">
                            <img src="assets/Middle.png" class="card-img-top p-3" alt="Middle" loading="lazy">
                            <div class="card-body text-center">
                                <h5 class="card-title">Middle</h5>
                            </div>
                        </div>
                        </a>
                    </div>

                    <div class="col-md-4">
                        <a href="assets/Retainning_Wall_1_Side_Corner_R.usdz" rel="ar" class="text-decoration-none d-block h-100">
                        <div class="card tower-option h-100" data-model="Retainning_Wall_1_Side_Corner_R">
                            <img src="assets/R.png" class="card-img-top p-3" alt="Type R" loading="lazy">
                            <div class="card-body text-center">
                                <h5 class="card-title">Type R</h5>
                            </div>
                        </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- iOS Quick Look Page-->
    <div id="viewer-page" class="container-fluid vh-100 position-relative d-none">
        <div id="info-box" class="alert alert-dark position-absolute top-0 start-0 m-3 d-none" style="max-width: 300px; z-index: 1000;">
            Informasi akan muncul di sini
        </div>

        <div id="dimensions-box" class="dimensions-box position-absolute top-0 end-0 m-3 d-none" aria-live="polite">
            Dimensi tersedia setelah model 3D dimuat.
        </div>

        <div id="fallback-container" class="position-absolute top-0 start-0 w-100 h-100 d-none"></div>

        <button id="back-button" class="btn btn-secondary position-absolute bottom-0 start-50 translate-middle-x mb-3">
            Kembali
        </button>
    </div>

    <!-- iOS Quick Look Page -->
    <div id="ar-quicklook" class="container-fluid vh-100 d-flex flex-column justify-content-center d-none">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <h2 class="mb-4">Pilih Retaing Wall Dalam Augmented Reality</h2>
                <p class="mb-4">Gunakan Quick Look di perangkat iOS</p>

                <div class="row g-4">
                    <div class="col-md-4">
                        <a href="assets/Retainning_Wall_1_Side_Corner_L.usdz" rel="ar" class="text-decoration-none">
                            <div class="card h-100 tower-option">
                                    <img src="assets/L.png" class="card-img-top p-3" alt="Type L" loading="lazy">
                                <div class="card-body">
                                    <p class="card-text">Type L</p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4">
                        <a href="assets/Retainning_Wall_1_Side_Middle.usdz" rel="ar" class="text-decoration-none">
                            <div class="card h-100 tower-option">
                                <img src="assets/Middle.png" class="card-img-top p-3" alt="Middle" loading="lazy">
                                <div class="card-body">
                                    <p class="card-text">Middle</p>
                                </div>
                            </div>
                        </a>
                    </div>

                    <div class="col-md-4">
                        <a href="assets/Retainning_Wall_1_Side_Corner_R.usdz" rel="ar" class="text-decoration-none">
                            <div class="card h-100 tower-option">
                                <img src="assets/R.png" class="card-img-top p-3" alt="Type R" loading="lazy">
                                <div class="card-body">
                                    <p class="card-text">Type R</p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

                <button id="quicklook-back" class="btn btn-secondary mt-4">
                    Kembali
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="app.js"></script>
</body>
</html>
